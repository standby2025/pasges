<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="875" viewBox="0 0 1000 875" lang="fr" role="img" aria-labelledby="title desc"><title id="title">Délai médian entre la sortie officielle et Homebrew</title><desc id="desc">Graphique à barres horizontales, unité heure. OpenCode 0.5, uv 1.6, llama.cpp 1.6, Codex 1.8, Claude Code 3.5, Hermes Agent 6.7, OpenClaw 8.0, Ollama 25.0, Gemini CLI 26.8. L&#x27;intervalle statistique va de 2026-08-11 à 2026-11-09 ; seules les versions correspondantes sont prises en compte et le décalage horaire médian ne constitue pas une couverture complète. Reconstruisez prompt : produisez une infographie SVG native autonome sans HTML, scripts ou dépendances distantes. Fond blanc, texte bleu foncé #203047, graphiques bleus #275fa4, article de distinction violet tap, distinction grise non incluse. Largeur 1000 pixels, la hauteur s&#x27;ajuste en fonction du contenu ; les étiquettes sont clairement emballées et non tronquées ; Le texte arabe est composé de droite à gauche. La langue du texte est français.</desc><rect width="1000" height="875" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Délai médian entre la sortie officielle et Homebrew</text><text x="32" y="97.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">OpenCode</text><rect x="32" y="118.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="118.5" width="12.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="138.5" font-size="22" fill="#203047" direction="ltr">0.5 heures</text><text x="32" y="175.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">uv</text><rect x="32" y="196.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="196.5" width="38.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="216.5" font-size="22" fill="#203047" direction="ltr">1.6 heures</text><text x="32" y="253.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">llama.cpp</text><rect x="32" y="274.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="274.5" width="38.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="294.5" font-size="22" fill="#203047" direction="ltr">1.6 heures</text><text x="32" y="331.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Codex</text><rect x="32" y="352.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="352.5" width="43.2" height="24" rx="5" fill="#275fa4"/><text x="778" y="372.5" font-size="22" fill="#203047" direction="ltr">1.8 heures</text><text x="32" y="409.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Claude Code</text><rect x="32" y="430.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="430.5" width="84.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="450.5" font-size="22" fill="#203047" direction="ltr">3.5 heures</text><text x="32" y="487.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Hermes Agent</text><rect x="32" y="508.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="508.5" width="160.8" height="24" rx="5" fill="#275fa4"/><text x="778" y="528.5" font-size="22" fill="#203047" direction="ltr">6.7 heures</text><text x="32" y="565.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">OpenClaw</text><rect x="32" y="586.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="586.5" width="192.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="606.5" font-size="22" fill="#203047" direction="ltr">8.0 heures</text><text x="32" y="643.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Ollama</text><rect x="32" y="664.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="664.5" width="600.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="684.5" font-size="22" fill="#203047" direction="ltr">25.0 heures</text><text x="32" y="721.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Gemini CLI</text><rect x="32" y="742.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="742.5" width="643.2" height="24" rx="5" fill="#275fa4"/><text x="778" y="762.5" font-size="22" fill="#203047" direction="ltr">26.8 heures</text><text x="32" y="799.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">2026-08-11 à 2026-11-09 ; Heure de libération de GitHub (Claude Code utilise npm) à</text><text x="32" y="826.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">l&#x27;heure de fusion de Homebrew.</text></g></svg>
