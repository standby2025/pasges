<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="581" viewBox="0 0 1000 581" lang="ru" role="img" aria-labelledby="title desc"><title id="title">Три способа установки и обновления / Одна точка входа, одна команда</title><desc id="desc">. Левый столбец последовательно соединяет скрипт curl с Claude Code, официальный сайт dmg с Ollama и npm с Gemini CLI; правый столбец состоит из Homebrew и brew. upgrade объединяет эти три инструмента унифицированным образом. Вышеизложенное объясняет разницу между тремя наборами методов обновления и одним входом. Перестроить prompt: создать автономную собственную инфографику SVG без HTML, сценариев или удаленных зависимостей. Белый фон, темно-синий текст #203047, синяя графика #275fa4, фиолетовый знак отличия tap, серый знак отличия не включен. Ширина 1000 пикселей, высота регулируется в зависимости от содержимого; этикетки четко завернуты и не обрезаны; Арабский текст набирается справа налево. Язык текста – русский.</desc><rect width="1000" height="581" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Три способа установки и обновления / Одна точка входа,</text><text x="32" y="85.5" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">одна команда</text><rect x="28" y="123.0" width="456" height="390" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><rect x="516" y="123.0" width="456" height="390" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><text x="48" y="141.0" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Раньше: разные способы</text><text x="48" y="175.5" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">установки</text><text x="48" y="210.0" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">curl</text><text x="48" y="241.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Claude Code</text><text x="48" y="284.5" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">официальный сайт dmg</text><text x="48" y="316.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Ollama</text><text x="48" y="359.0" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">npm</text><text x="48" y="390.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Gemini CLI</text><text x="536" y="141.0" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Теперь: всё через Homebrew</text><text x="536" y="175.5" font-size="26" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Homebrew</text><text x="536" y="214.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">brew upgrade</text><text x="536" y="247.5" font-size="26" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">↓</text><text x="536" y="286.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Claude Code</text><text x="536" y="319.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Ollama</text><text x="536" y="352.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Gemini CLI</text></g></svg>
