<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1024" viewBox="0 0 1000 1024" lang="en" role="img" aria-labelledby="title desc"><title id="title">Popular AI software: 17 of 23 available via Homebrew</title><desc id="desc">project coverage matrix. Agent 8/8: OpenClaw, DeepSeek Harness, Hermes Agent, ZXQ KEEP0006QXZ, Claude Code, Codex, Gemini CLI, Pi are all official warehouses. Local models 3/3: Ollama, llama.cpp, Whisper, all are official warehouses. Other tools 6/12: cc-switch, spec-kit, ComfyUI desktop version, Open Design are official warehouses; Orca, VoiceStudio are projects tap; claw-code, Stable Diffusion WebUI, Graphify, MoneyPrinterTurbo, Paperclip, RuView are not included. Total 17/23, including official 15, tap and 2. Rebuild prompt: Produce a standalone native SVG infographic without HTML, scripts or remote dependencies. White background, dark blue text #203047, blue graphics #275fa4, purple distinction item tap, gray distinction not included. Width 1000 pixels, the height adjusts according to the content; labels are clearly wrapped and not cropped; Arabic text is typed from right to left. The text language is English.</desc><rect width="1000" height="1024" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Popular AI software: 17 of 23 available via Homebrew</text><text x="32" y="97.5" font-size="19" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">■ official warehouse · ■ Project own tap · □ Not included yet</text><text x="32" y="146.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">AI Agent and programming assistant · 8 / 8</text><text x="32" y="179.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ OpenClaw · official warehouse<