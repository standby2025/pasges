<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="848" viewBox="0 0 1000 848" lang="zh" role="img" aria-labelledby="title desc"><title id="title">官方发布到 Homebrew 的中位时差</title><desc id="desc">水平条形图，单位小时。OpenCode 0.5、uv 1.6、llama.cpp 1.6、Codex 1.8、Claude Code 3.5、Hermes Agent 6.7、OpenClaw 8.0、Ollama 25.0、Gemini CLI 26.8。统计区间 2026-08-11 至 2026-11-09；仅统计能匹配的版本，中位时差不是完整覆盖率。 重建 prompt：制作独立原生 SVG 信息图，不含 HTML、脚本或远程依赖。白色背景，深蓝正文 #203047，蓝色图形 #275fa4，紫色区分项目 tap，灰色区分未收录。宽 1000 像素，高度随内容调整；标签清晰换行，不裁切；阿拉伯文使用从右向左文字排版。文字语言为 中文。</desc><rect width="1000" height="848" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">官方发布到 Homebrew 的中位时差</text><text x="32" y="97.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">OpenCode</text><rect x="32" y="118.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="118.5" width="12.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="138.5" font-size="22" fill="#203047" direction="ltr">0.5 小时</text><text x="32" y="175.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">uv</text><rect x="32" y="196.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="196.5" width="38.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="216.5" font-size="22" fill="#203047" direction="ltr">1.6 小时</text><text x="32" y="253.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">llama.cpp</text><rect x="32" y="274.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="274.5" width="38.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="294.5" font-size="22" fill="#203047" direction="ltr">1.6 小时</text><text x="32" y="331.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Codex</text><rect x="32" y="352.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="352.5" width="43.2" height="24" rx="5" fill="#275fa4"/><text x="778" y="372.5" font-size="22" fill="#203047" direction="ltr">1.8 小时</text><text x="32" y="409.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Claude Code</text><rect x="32" y="430.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="430.5" width="84.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="450.5" font-size="22" fill="#203047" direction="ltr">3.5 小时</text><text x="32" y="487.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Hermes Agent</text><rect x="32" y="508.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="508.5" width="160.8" height="24" rx="5" fill="#275fa4"/><text x="778" y="528.5" font-size="22" fill="#203047" direction="ltr">6.7 小时</text><text x="32" y="565.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">OpenClaw</text><rect x="32" y="586.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="586.5" width="192.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="606.5" font-size="22" fill="#203047" direction="ltr">8.0 小时</text><text x="32" y="643.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Ollama</text><rect x="32" y="664.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="664.5" width="600.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="684.5" font-size="22" fill="#203047" direction="ltr">25.0 小时</text><text x="32" y="721.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Gemini CLI</text><rect x="32" y="742.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="742.5" width="643.2" height="24" rx="5" fill="#275fa4"/><text x="778" y="762.5" font-size="22" fill="#203047" direction="ltr">26.8 小时</text><text x="32" y="799.