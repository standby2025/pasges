<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="875" viewBox="0 0 1000 875" lang="es" role="img" aria-labelledby="title desc"><title id="title">Retraso mediano entre el lanzamiento oficial y Homebrew</title><desc id="desc">Gráfico de barras horizontales, unidad hora. OpenCode 0.5, uv 1.6, llama.cpp 1.6, Codex 1.8, Claude Code 3.5, Hermes Agent 6.7, OpenClaw 8.0, Ollama 25.0, Gemini CLI 26.8. El intervalo estadístico es de 2026-08-11 a 2026-11-09; sólo se cuentan las versiones coincidentes y la diferencia horaria media no es una cobertura completa. Reconstruir prompt: produzca una infografía nativa independiente de SVG sin HTML, scripts ni dependencias remotas. Fondo blanco, texto azul oscuro #203047, gráficos azules #275fa4, elemento de distinción violeta tap, distinción gris no incluida. Ancho 1000 píxeles, la altura se ajusta según el contenido; las etiquetas están claramente envueltas y no recortadas; El texto árabe está escrito de derecha a izquierda. El idioma del texto es español.</desc><rect width="1000" height="875" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Retraso mediano entre el lanzamiento oficial y Homebrew</text><text x="32" y="97.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">OpenCode</text><rect x="32" y="118.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="118.5" width="12.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="138.5" font-size="22" fill="#203047" direction="ltr">0.5 horas</text><text x="32" y="175.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">uv</text><rect x="32" y="196.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="196.5" width="38.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="216.5" font-size="22" fill="#203047" direction="ltr">1.6 horas</text><text x="32" y="253.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">llama.cpp</text><rect x="32" y="274.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="274.5" width="38.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="294.5" font-size="22" fill="#203047" direction="ltr">1.6 horas</text><text x="32" y="331.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Codex</text><rect x="32" y="352.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="352.5" width="43.2" height="24" rx="5" fill="#275fa4"/><text x="778" y="372.5" font-size="22" fill="#203047" direction="ltr">1.8 horas</text><text x="32" y="409.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Claude Code</text><rect x="32" y="430.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="430.5" width="84.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="450.5" font-size="22" fill="#203047" direction="ltr">3.5 horas</text><text x="32" y="487.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Hermes Agent</text><rect x="32" y="508.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="508.5" width="160.8" height="24" rx="5" fill="#275fa4"/><text x="778" y="528.5" font-size="22" fill="#203047" direction="ltr">6.7 horas</text><text x="32" y="565.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">OpenClaw</text><rect x="32" y="586.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="586.5" width="192.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="606.5" font-size="22" fill="#203047" direction="ltr">8.0 horas</text><text x="32" y="643.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Ollama</text><rect x="32" y="664.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="664.5" width="600.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="684.5" font-size="22" fill="#203047" direction="ltr">25.0 horas</text><text x="32" y="721.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Gemini CLI</text><rect x="32" y="742.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="742.5" width="643.2" height="24" rx="5" fill="#275fa4"/><text x="778" y="762.5" font-size="22" fill="#203047" direction="ltr">26.8 horas</text><text x="32" y="799.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">2026-08-11 a 2026-11-09; GitHub Tiempo de liberación (Claude Code usa npm) al tiempo de</text><text x="32" y="826.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">fusión Homebrew.</text></g></svg>
