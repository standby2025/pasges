<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" lang="zh" role="img" aria-labelledby="title desc"><title id="title">三种装法、三套升级方式 / 一个入口、一条升级命令</title><desc id="desc">对比流程图。左栏依次连接 curl 脚本到 Claude Code、官网 dmg 到 Ollama、npm 到 Gemini CLI；右栏由 Homebrew 和 brew upgrade 统一连接这三个工具。上方说明三套升级方式与一个入口的差别。 重建 prompt：制作独立原生 SVG 信息图，不含 HTML、脚本或远程依赖。白色背景，深蓝正文 #203047，蓝色图形 #275fa4，紫色区分项目 tap，灰色区分未收录。宽 1000 像素，高度随内容调整；标签清晰换行，不裁切；阿拉伯文使用从右向左文字排版。文字语言为 中文。</desc><rect width="1000" height="505" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">三种装法、三套升级方式 / 一个入口、一条升级命令</text><rect x="28" y="103.5" width="456" height="350" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><rect x="516" y="103.5" width="456" height="350" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><text x="256" y="147.6" font-size="23" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">以前：各装各的</text><text x="744" y="147.6" font-size="23" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">现在：统一交给 Homebrew</text><rect x="48" y="198.5" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="123.0" y="233.2" font-size="19" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed">curl 脚本</text><path d="M198 226.5 L244 226.5" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M246 226.5 l-10 -6 l0 12 z" fill="#7d8fa6"/><rect x="250" y="198.5" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="357.0" y="233.8" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Claude Code</text><rect x="48" y="268.5" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="123.0" y="303.1" font-size="19" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed">官网 dmg</text><path d="M198 296.5 L244 296.5" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M246 296.5 l-10 -6 l0 12 z" fill="#7d8fa6"/><rect x="250" y="268.5" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="357.0" y="303.9" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Ollama</text><rect x="48" y="338.5" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="123.0" y="373.1" font-size="19" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed">npm</text><path d="M198 366.5 L244 366.5" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M246 366.5 l-10 -6 l0 12 z" fill="#7d8fa6"/><rect x="250" y="338.5" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="357.0" y="373.9" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Gemini CLI</text><rect x="536" y="264.5" width="150" height="64" rx="10" fill="#275fa4" stroke="#275fa4"/><text x="611.0" y="291.8" font-size="19" fill="#ffffff" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Homebrew</text><text x="611.0" y="314.6" font-size="19" fill="#ffffff" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">brew upgrade</text><path d="M686 296.5 C712.0 296.5 712.0 226.5 730 226.5" stroke="#275fa4" stroke-width="2.4" fill="none"/><path d="M738 226.5 l-10 -6 l0 12 z" fill="#275fa4"/><rect x="742" y="198.5" width="222" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="853.0" y="233.8" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Claude Code</text><path d="M686 296.5 C712.0 296.5 712.0 296.5 730 296.5" stroke="#275fa4" stroke-width="2.4" fill="none"/><path d="M738 296.5 l-10 -6 l0 12 z" fill="#275fa4"/><rect x="742" y="268.5" width="222" height=