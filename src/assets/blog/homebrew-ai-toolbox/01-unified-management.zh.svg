<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="537" viewBox="0 0 1000 537" lang="zh" role="img" aria-labelledby="title desc"><title id="title">三种装法、三套升级方式 / 一个入口、一条升级命令</title><desc id="desc">对比流程图。左栏依次连接 curl 脚本到 Claude Code、官网 dmg 到 Ollama、npm 到 Gemini CLI；右栏由 Homebrew 和 brew upgrade 统一连接这三个工具。上方说明三套升级方式与一个入口的差别。 重建 prompt：制作独立原生 SVG 信息图，不含 HTML、脚本或远程依赖。白色背景，深蓝正文 #203047，蓝色图形 #275fa4，紫色区分项目 tap，灰色区分未收录。宽 1000 像素，高度随内容调整；标签清晰换行，不裁切；阿拉伯文使用从右向左文字排版。文字语言为 中文。</desc><rect width="1000" height="537" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">三种装法、三套升级方式 / 一个入口、一条升级命令</text><rect x="28" y="79.5" width="456" height="390" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><rect x="516" y="79.5" width="456" height="390" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><text x="48" y="97.5" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">以前：各装各的</text><text x="48" y="132.0" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">curl 脚本</text><text x="48" y="163.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Claude Code</text><text x="48" y="206.5" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">官网 dmg</text><text x="48" y="238.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Ollama</text><text x="48" y="281.0" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">npm</text><text x="48" y="312.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Gemini CLI</text><text x="536" y="97.5" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">现在：统一交给 Homebrew</text><text x="536" y="132.0" font-size="26" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Homebrew</text><text x="536" y="171.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">brew upgrade</text><text x="536" y="204.0" font-size="26" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">↓</text><text x="536" y="243.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Claude Code</text><text x="536" y="276.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Ollama</text><text x="536" y="309.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Gemini CLI</text></g></svg>
