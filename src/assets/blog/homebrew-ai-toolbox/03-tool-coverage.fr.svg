<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1051" viewBox="0 0 1000 1051" lang="fr" role="img" aria-labelledby="title desc"><title id="title">Logiciels d’IA populaires : 17 sur 23 dans Homebrew</title><desc id="desc">. Agent 8/8 : OpenClaw, DeepSeek Harness, Hermes Agent, ZXQ KEEP0006QXZ, Claude Code, Codex, Gemini CLI, Pi sont tous des entrepôts officiels. Modèles locaux 3/3 : Ollama, llama.cpp, Whisper, tous sont des entrepôts officiels. Autres outils 6/12 : cc-switch, spec-kit, version de bureau ComfyUI, Open Design sont des entrepôts officiels ; Orca, VoiceStudio sont des projets tap ; claw-code, Stable Diffusion WebUI, Graphify, MoneyPrinterTurbo, Paperclip, RuView ne sont pas inclus. Total 17/23, y compris les 15 officiels, tap et 2. Reconstruisez prompt : produisez une infographie SVG native autonome sans HTML, scripts ou dépendances distantes. Fond blanc, texte bleu foncé #203047, graphiques bleus #275fa4, article de distinction violet tap, distinction grise non incluse. Largeur 1000 pixels, la hauteur s&#x27;ajuste en fonction du contenu ; les étiquettes sont clairement emballées et non tronquées ; Le texte arabe est tapé de droite à gauche. La langue du texte est français.</desc><rect width="1000" height="1051" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Logiciels d’IA populaires : 17 sur 23 dans Homebrew</text><text x="32" y="97.5" font-size="19" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">■  · ■ Projet propre tap · □ Pas encore inclus</text><text x="32" y="146.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">AI Agent et assistant de programmation · 8 / 8</text><text x="32" y="179.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ OpenClaw · </text><text x="32" y="209.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ DeepSeek Harness · </text><text x="32" y="239.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ Hermes Agent · </text><text x="32" y="269.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ OpenCode · </text><text x="32" y="299.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ Claude Code · </text><text x="32" y="329.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ Codex · </text><text x="32" y="359.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ Gemini CLI · </text><text x="32" y="389.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ Pi · </text><text x="32" y="439.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">· 3 / 3</text><text x="32" y="472.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ Ollama · </text><text x="32" y="502.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ llama.cpp · </text><text x="32" y="532.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ Whisper · </text><text x="32" y="582.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Autres AI Outils et ordinateurs de bureau App · 6 / 12</text><text x="32" y="615.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ cc-switch · </text><text x="32" y="645.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ spec-kit · </text><text x="32" y="675.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ ComfyUI Version de bureau · </text><text x="32" y="705.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ Open Design · </text><text x="32" y="735.0" font-size="20" fill="#6250d6" text-anchor="start" direction="ltr" unicode-bidi="embed">■ Orca · Projet propre tap</text><text x="32" y="765.0" font-size="20" fill="#6250d6" text-anchor="start" direction="ltr" unicode-bidi="embed">■ VoiceStudio · Projet propre tap</text><text x="32" y="795.0" font-size="20" fill="#637388" text-anchor="start" direction="ltr" unicode-bidi="embed">□ claw-code · Pas encore inclus</text><text x="32" y="825.0" font-size="20" fill="#637388" text-anchor="start" direction="ltr" unicode-bidi="embed">□ Stable Diffusion WebUI · Pas encore inclus</text><text x="32" y="855.0" font-size="20" fill="#637388" text-anchor="start" direction="ltr" unicode-bidi="embed">□ Graphify · Pas encore inclus</text><text x="32" y="885.0" font-size="20" fill="#637388" text-anchor="start" direction="ltr" unicode-bidi="embed">□ MoneyPrinterTurbo · Pas encore inclus</text><text x="32" y="915.0" font-size="20" fill="#637388" text-anchor="start" direction="ltr" unicode-bidi="embed">□ Paperclip · Pas encore inclus</text><text x="32" y="945.0" font-size="20" fill="#637388" text-anchor="start" direction="ltr" unicode-bidi="embed">□ RuView · Pas encore inclus</text><text x="32" y="975.0" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">À partir de 2026-11-09 ; Entrepôts officiels 15, projets 2 tap. Chaque carré représente un</text><text x="32" y="1002.0" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">élément.</text></g></svg>
