<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="875" viewBox="0 0 1000 875" lang="ar" role="img" aria-labelledby="title desc"><title id="title">وسيط التأخر من الإصدار الرسمي إلى Homebrew</title><desc id="desc">مخطط أشرطة أفقي لوسيط التأخر بالساعات: OpenCode 0.5، uv 1.6، llama.cpp 1.6، Codex 1.8، Claude Code 3.5، Hermes Agent 6.7، OpenClaw 8.0، Ollama 25.0، Gemini CLI 26.8. فترة البيانات من 2026-08-11 إلى 2026-11-09. تشمل الإصدارات التي أمكن مطابقتها فقط، ولا يمثل الوسيط معدل التغطية الكامل. تعليمات إعادة الإنشاء: أنشئ رسماً معلوماتياً مستقلاً بصيغة SVG أصلية، دون HTML أو نصوص برمجية أو اعتماد على موارد خارجية. خلفية بيضاء، ونص أزرق داكن #203047، وأشكال زرقاء #275fa4، وبنفسجي لمستودعات tap الخاصة بالمشاريع، ورمادي للمشاريع غير المدرجة. العرض 1000 بكسل، والارتفاع حسب المحتوى. لفّ التسميات بوضوح دون قصها، واستخدم اتجاه الكتابة من اليمين إلى اليسار. لغة النص: العربية.</desc><rect width="1000" height="875" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="968" y="42" font-size="29" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">وسيط التأخر من الإصدار الرسمي إلى Homebrew</text><text x="968" y="97.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">OpenCode</text><rect x="32" y="118.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="118.5" width="12.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="138.5" font-size="22" fill="#203047" direction="ltr">0.5 ساعة</text><text x="968" y="175.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">uv</text><rect x="32" y="196.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="196.5" width="38.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="216.5" font-size="22" fill="#203047" direction="ltr">1.6 ساعة</text><text x="968" y="253.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">llama.cpp</text><rect x="32" y="274.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="274.5" width="38.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="294.5" font-size="22" fill="#203047" direction="ltr">1.6 ساعة</text><text x="968" y="331.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Codex</text><rect x="32" y="352.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="352.5" width="43.2" height="24" rx="5" fill="#275fa4"/><text x="778" y="372.5" font-size="22" fill="#203047" direction="ltr">1.8 ساعة</text><text x="968" y="409.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Claude Code</text><rect x="32" y="430.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="430.5" width="84.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="450.5" font-size="22" fill="#203047" direction="ltr">3.5 ساعة</text><text x="968" y="487.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Hermes Agent</text><rect x="32" y="508.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="508.5" width="160.8" height="24" rx="5" fill="#275fa4"/><text x="778" y="528.5" font-size="22" fill="#203047" direction="ltr">6.7 ساعة</text><text x="968" y="565.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">OpenClaw</text><rect x="32" y="586.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="586.5" width="192.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="606.5" font-size="22" fill="#203047" direction="ltr">8.0 ساعة</text><text x="968" y="643.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Ollama</text><rect x="32" y="664.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="664.5" width="600.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="684.5" font-size="22" fill="#203047" direction="ltr">25.0 ساعة</text><text x="968" y="721.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Gemini CLI</text><rect x="32" y="742.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="742.5" width="643.2" height="24" rx="5" fill="#275fa4"/><text x="778" y="762.5" font-size="22" fill="#203047" direction="ltr">26.8 ساعة</text><text x="968" y="799.5" font-size="18" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">2026-08-11 إلى 2026-11-09; وقت إصدار GitHub (Claude Code استخدم npm) إلى وقت الدمج</text><text x="968" y="826.5" font-size="18" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Homebrew.</text></g></svg>
