<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="875" viewBox="0 0 1000 875" lang="ru" role="img" aria-labelledby="title desc"><title id="title">Медианная задержка от релиза до Homebrew</title><desc id="desc">Горизонтальная гистограмма, единица измерения час. OpenCode 0.5, uv 1.6, llama.cpp 1.6, Codex 1.8, Claude Code 3.5, Hermes Agent 6.7, OpenClaw 8.0, Ollama 25.0, Gemini CLI 26.8. Статистический интервал: от 2026-08-11 до 2026-11-09; учитываются только совпадающие версии, а медианная разница во времени не является полным охватом. Перестроить prompt: создать автономную собственную инфографику SVG без HTML, сценариев или удаленных зависимостей. Белый фон, темно-синий текст #203047, синяя графика #275fa4, фиолетовый знак отличия tap, серый знак отличия не включен. Ширина 1000 пикселей, высота регулируется в зависимости от содержимого; этикетки четко завернуты и не обрезаны; Арабский текст набирается справа налево. Язык текста – русский.</desc><rect width="1000" height="875" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Медианная задержка от релиза до Homebrew</text><text x="32" y="97.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">OpenCode</text><rect x="32" y="118.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="118.5" width="12.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="138.5" font-size="22" fill="#203047" direction="ltr">0.5 часов</text><text x="32" y="175.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">uv</text><rect x="32" y="196.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="196.5" width="38.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="216.5" font-size="22" fill="#203047" direction="ltr">1.6 часов</text><text x="32" y="253.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">llama.cpp</text><rect x="32" y="274.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="274.5" width="38.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="294.5" font-size="22" fill="#203047" direction="ltr">1.6 часов</text><text x="32" y="331.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Codex</text><rect x="32" y="352.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="352.5" width="43.2" height="24" rx="5" fill="#275fa4"/><text x="778" y="372.5" font-size="22" fill="#203047" direction="ltr">1.8 часов</text><text x="32" y="409.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Claude Code</text><rect x="32" y="430.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="430.5" width="84.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="450.5" font-size="22" fill="#203047" direction="ltr">3.5 часов</text><text x="32" y="487.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Hermes Agent</text><rect x="32" y="508.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="508.5" width="160.8" height="24" rx="5" fill="#275fa4"/><text x="778" y="528.5" font-size="22" fill="#203047" direction="ltr">6.7 часов</text><text x="32" y="565.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">OpenClaw</text><rect x="32" y="586.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="586.5" width="192.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="606.5" font-size="22" fill="#203047" direction="ltr">8.0 часов</text><text x="32" y="643.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Ollama</text><rect x="32" y="664.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="664.5" width="600.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="684.5" font-size="22" fill="#203047" direction="ltr">25.0 часов</text><text x="32" y="721.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Gemini CLI</text><rect x="32" y="742.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="742.5" width="643.2" height="24" rx="5" fill="#275fa4"/><text x="778" y="762.5" font-size="22" fill="#203047" direction="ltr">26.8 часов</text><text x="32" y="799.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">2026-08-11 - 2026-11-09; Время выпуска от GitHub (Claude Code использует npm) до времени</text><text x="32" y="826.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">слияния Homebrew.</text></g></svg>
