<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="581" viewBox="0 0 1000 581" lang="fr" role="img" aria-labelledby="title desc"><title id="title">Trois méthodes d’installation et de mise à jour / Un seul point d’entrée et une commande</title><desc id="desc">. La colonne de gauche connecte le script curl à Claude Code, le site officiel dmg à Ollama et npm à Gemini CLI dans l&#x27;ordre ; la colonne de droite se compose de Homebrew et brew upgrade connecte ces trois outils de manière unifiée. Ce qui précède explique la différence entre trois ensembles de méthodes de mise à niveau et une entrée. Reconstruisez prompt : produisez une infographie SVG native autonome sans HTML, scripts ou dépendances distantes. Fond blanc, texte bleu foncé #203047, graphiques bleus #275fa4, article de distinction violet tap, distinction grise non incluse. Largeur 1000 pixels, la hauteur est ajustée en fonction du contenu ; les étiquettes sont clairement emballées et non tronquées ; Le texte arabe est composé de droite à gauche. La langue du texte est français.</desc><rect width="1000" height="581" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Trois méthodes d’installation et de mise à jour / Un seul</text><text x="32" y="85.5" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">point d’entrée et une commande</text><rect x="28" y="123.0" width="456" height="390" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><rect x="516" y="123.0" width="456" height="390" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><text x="48" y="141.0" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Avant : installations</text><text x="48" y="175.5" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">séparées</text><text x="48" y="210.0" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">curl</text><text x="48" y="241.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Claude Code</text><text x="48" y="284.5" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">dmg</text><text x="48" y="316.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Ollama</text><text x="48" y="359.0" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">npm</text><text x="48" y="390.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Gemini CLI</text><text x="536" y="141.0" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Maintenant : tout gérer avec</text><text x="536" y="175.5" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Homebrew</text><text x="536" y="210.0" font-size="26" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Homebrew</text><text x="536" y="249.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">brew upgrade</text><text x="536" y="282.0" font-size="26" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">↓</text><text x="536" y="321.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Claude Code</text><text x="536" y="354.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Ollama</text><text x="536" y="387.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Gemini CLI</text></g></svg>
