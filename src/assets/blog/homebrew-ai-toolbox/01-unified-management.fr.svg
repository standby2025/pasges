<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="549" viewBox="0 0 1000 549" lang="fr" role="img" aria-labelledby="title desc"><title id="title">Trois méthodes d’installation et de mise à jour / Un seul point d’entrée et une commande</title><desc id="desc">. La colonne de gauche connecte le script curl à Claude Code, le site officiel dmg à Ollama et npm à Gemini CLI dans l&#x27;ordre ; la colonne de droite se compose de Homebrew et brew upgrade connecte ces trois outils de manière unifiée. Ce qui précède explique la différence entre trois ensembles de méthodes de mise à niveau et une entrée. Reconstruisez prompt : produisez une infographie SVG native autonome sans HTML, scripts ou dépendances distantes. Fond blanc, texte bleu foncé #203047, graphiques bleus #275fa4, article de distinction violet tap, distinction grise non incluse. Largeur 1000 pixels, la hauteur est ajustée en fonction du contenu ; les étiquettes sont clairement emballées et non tronquées ; Le texte arabe est composé de droite à gauche. La langue du texte est français.</desc><rect width="1000" height="549" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Trois méthodes d’installation et de mise à jour / Un seul</text><text x="32" y="85.5" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">point d’entrée et une commande</text><rect x="28" y="147.0" width="456" height="350" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><rect x="516" y="147.0" width="456" height="350" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><text x="256" y="191.1" font-size="23" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Avant : installations séparées</text><text x="744" y="177.2" font-size="23" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Maintenant : tout gérer avec</text><text x="744" y="204.8" font-size="23" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Homebrew</text><rect x="48" y="242.0" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="123.0" y="276.6" font-size="19" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed">curl</text><path d="M198 270.0 L244 270.0" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M246 270.0 l-10 -6 l0 12 z" fill="#7d8fa6"/><rect x="250" y="242.0" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="357.0" y="277.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Claude Code</text><rect x="48" y="312.0" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="123.0" y="346.6" font-size="19" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed">dmg</text><path d="M198 340.0 L244 340.0" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M246 340.0 l-10 -6 l0 12 z" fill="#7d8fa6"/><rect x="250" y="312.0" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="357.0" y="347.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Ollama</text><rect x="48" y="382.0" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="123.0" y="416.6" font-size="19" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed">npm</text><path d="M198 410.0 L244 410.0" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M246 410.0 l-10 -6 l0 12 z" fill="#7d8fa6"/><rect x="250" y="382.0" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="357.0" y="417.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Gemini CLI</text><rect x="536" y="308.0" width="150" height="64" rx="10" fill="#275fa4" stroke="#275fa4"/><text x="611.0" y="335.2" font-size="19" fill="#ffffff" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Homebrew</text><text x="611.0" y="358.1" font-size="19" fill="#ffffff" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">brew upgrade</text><path d="M686 340.0 C712.0 340.0 712.0 270.0 730 270.0" stroke="#275fa4" stroke-width="2.4" fill="none"/><path d="M738 270.0 l-10 -6 l0 12 z" fill="#275fa4"/><rect x="742" y="242.0" width="222" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="853.0" y="277.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Claude Code</text><path d="M686 340.0 C712.0 340.0 712.0 340.0 730 340.0" stroke="#275fa4" stroke-width="2.4" fill="none"/><path d="M738 340.0 l-10 -6 l0 12 z" fill="#275fa4"/><rect x="742" y="312.0" width="222" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="853.0" y="347.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Ollama</text><path d="M686 340.0 C712.0 340.0 712.0 410.0 730 410.0" stroke="#275fa4" stroke-width="2.4" fill="none"/><path d="M738 410.0 l-10 -6 l0 12 z" fill="#275fa4"/><rect x="742" y="382.0" width="222" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="853.0" y="417.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Gemini CLI</text><text x="256" y="472.8" font-size="17" fill="#5a6b80" text-anchor="middle" direction="ltr" unicode-bidi="embed">Trois méthodes d’installation et</text><text x="256" y="493.1" font-size="17" fill="#5a6b80" text-anchor="middle" direction="ltr" unicode-bidi="embed">de mise à jour</text><text x="744" y="472.8" font-size="17" fill="#5a6b80" text-anchor="middle" direction="ltr" unicode-bidi="embed">Un seul point d’entrée et une</text><text x="744" y="493.1"