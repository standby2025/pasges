<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="549" viewBox="0 0 1000 549" lang="es" role="img" aria-labelledby="title desc"><title id="title">Tres métodos de instalación y actualización / Un punto de entrada, un comando</title><desc id="desc">. La columna de la izquierda conecta el script curl con Claude Code, el sitio web oficial dmg con Ollama y npm con Gemini CLI en secuencia; la columna de la derecha consta de Homebrew y brew upgrade conecta estas tres herramientas de forma unificada. Lo anterior explica la diferencia entre tres conjuntos de métodos de actualización y una entrada. Reconstruir prompt: produzca una infografía nativa independiente de SVG sin HTML, scripts ni dependencias remotas. Fondo blanco, texto azul oscuro #203047, gráficos azules #275fa4, elemento de distinción violeta tap, distinción gris no incluida. Ancho 1000 píxeles, la altura se ajusta según el contenido; las etiquetas están claramente envueltas y no recortadas; El texto árabe está escrito de derecha a izquierda. El idioma del texto es español.</desc><rect width="1000" height="549" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Tres métodos de instalación y actualización / Un punto de</text><text x="32" y="85.5" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">entrada, un comando</text><rect x="28" y="147.0" width="456" height="350" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><rect x="516" y="147.0" width="456" height="350" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><text x="256" y="191.1" font-size="23" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Antes: instalaciones separadas</text><text x="744" y="191.1" font-size="23" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Ahora: todo con Homebrew</text><rect x="48" y="242.0" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="123.0" y="276.6" font-size="19" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed">curl</text><path d="M198 270.0 L244 270.0" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M246 270.0 l-10 -6 l0 12 z" fill="#7d8fa6"/><rect x="250" y="242.0" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="357.0" y="277.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Claude Code</text><rect x="48" y="312.0" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="123.0" y="346.6" font-size="19" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed">dmg</text><path d="M198 340.0 L244 340.0" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M246 340.0 l-10 -6 l0 12 z" fill="#7d8fa6"/><rect x="250" y="312.0" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="357.0" y="347.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Ollama</text><rect x="48" y="382.0" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="123.0" y="416.6" font-size="19" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed">npm</text><path d="M198 410.0 L244 410.0" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M246 410.0 l-10 -6 l0 12 z" fill="#7d8fa6"/><rect x="250" y="382.0" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="357.0" y="417.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Gemini CLI</text><rect x="536" y="308.0" width="150" height="64" rx="10" fill="#275fa4" stroke="#275fa4"/><text x="611.0" y="335.2" font-size="19" fill="#ffffff" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Homebrew</text><text x="611.0" y="358.1" font-size="19" fill="#ffffff" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">brew upgrade</text><path d="M686 340.0 C712.0 340.0 712.0 270.0 730 270.0" stroke="#275fa4" stroke-width="2.4" fill="none"/><path d="M738 270.0 l-10 -6 l0 12 z" fill="#275fa4"/><rect x="742" y="242.0" width="222" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="853.0" y="277.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Claude Code</text><path d="M686 340.0 C712.0 340.0 712.0 340.0 730 340.0" stroke="#275fa4" stroke-width="2.4" fill="none"/><path d="M738 340.0 l-10 -6 l0 12 z" fill="#275fa4"/><rect x="742" y="312.0" width="222" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="853.0" y="347.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Ollama</text><path d="M686 340.0 C712.0 340.0 712.0 410.0 730 410.0" stroke="#275fa4" stroke-width="2.4" fill="none"/><path d="M738 410.0 l-10 -6 l0 12 z" fill="#275fa4"/><rect x="742" y="382.0" width="222" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="853.0" y="417.4" font-size="21" fill="#203047" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-weight="600">Gemini CLI</text><text x="256" y="472.8" font-size="17" fill="#5a6b80" text-anchor="middle" direction="ltr" unicode-bidi="embed">Tres métodos de instalación y</text><text x="256" y="493.1" font-size="17" fill="#5a6b80" text-anchor="middle" direction="ltr" unicode-bidi="embed">actualización</text><text x="744" y="482.9" font-size="17" fill="#5a6b80" text-anchor="middle" direction="ltr" unicode-bidi="embed">Un punto de entrada, un comando</text></g></svg>
