<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="581" viewBox="0 0 1000 581" lang="es" role="img" aria-labelledby="title desc"><title id="title">Tres métodos de instalación y actualización / Un punto de entrada, un comando</title><desc id="desc">. La columna de la izquierda conecta el script curl con Claude Code, el sitio web oficial dmg con Ollama y npm con Gemini CLI en secuencia; la columna de la derecha consta de Homebrew y brew upgrade conecta estas tres herramientas de forma unificada. Lo anterior explica la diferencia entre tres conjuntos de métodos de actualización y una entrada. Reconstruir prompt: produzca una infografía nativa independiente de SVG sin HTML, scripts ni dependencias remotas. Fondo blanco, texto azul oscuro #203047, gráficos azules #275fa4, elemento de distinción violeta tap, distinción gris no incluida. Ancho 1000 píxeles, la altura se ajusta según el contenido; las etiquetas están claramente envueltas y no recortadas; El texto árabe está escrito de derecha a izquierda. El idioma del texto es español.</desc><rect width="1000" height="581" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Tres métodos de instalación y actualización / Un punto de</text><text x="32" y="85.5" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">entrada, un comando</text><rect x="28" y="123.0" width="456" height="390" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><rect x="516" y="123.0" width="456" height="390" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><text x="48" y="141.0" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Antes: instalaciones</text><text x="48" y="175.5" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">separadas</text><text x="48" y="210.0" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">curl</text><text x="48" y="241.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Claude Code</text><text x="48" y="284.5" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">dmg</text><text x="48" y="316.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Ollama</text><text x="48" y="359.0" font-size="21" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">npm</text><text x="48" y="390.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">→ Gemini CLI</text><text x="536" y="141.0" font-size="23" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Ahora: todo con Homebrew</text><text x="536" y="175.5" font-size="26" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Homebrew</text><text x="536" y="214.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">brew upgrade</text><text x="536" y="247.5" font-size="26" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">↓</text><text x="536" y="286.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Claude Code</text><text x="536" y="319.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Ollama</text><text x="536" y="352.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Gemini CLI</text></g></svg>
