<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="537" viewBox="0 0 1000 537" lang="ar" role="img" aria-labelledby="title desc"><title id="title">ثلاث طرق للتثبيت والتحديث / مدخل واحد وأمر تحديث واحد</title><desc id="desc">مخطط مقارنة بعمودين. في العمود الأيمن يتصل نص curl بـ Claude Code وملف dmg من الموقع الرسمي بـ Ollama وnpm بـ Gemini CLI، مع ثلاث طرق مستقلة للترقية. في العمود الأيسر يدير Homebrew والأمر brew upgrade الأدوات الثلاث من نقطة واحدة. وضّح الفرق بين ثلاث طرق للترقية ومدخل موحد. تعليمات إعادة الإنشاء: أنشئ رسماً معلوماتياً مستقلاً بصيغة SVG أصلية، دون HTML أو نصوص برمجية أو اعتماد على موارد خارجية. خلفية بيضاء، ونص أزرق داكن #203047، وأشكال زرقاء #275fa4، وبنفسجي لمستودعات tap الخاصة بالمشاريع، ورمادي للمشاريع غير المدرجة. العرض 1000 بكسل، والارتفاع حسب المحتوى. لفّ التسميات بوضوح دون قصها، واستخدم اتجاه الكتابة من اليمين إلى اليسار. لغة النص: العربية.</desc><rect width="1000" height="537" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="968" y="42" font-size="29" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">ثلاث طرق للتثبيت والتحديث / مدخل واحد وأمر تحديث واحد</text><rect x="28" y="79.5" width="456" height="390" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><rect x="516" y="79.5" width="456" height="390" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><text x="952" y="97.5" font-size="23" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">سابقاً: طرق تثبيت منفصلة</text><text x="952" y="132.0" font-size="21" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">البرنامج النصي curl</text><text x="952" y="163.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">→ Claude Code</text><text x="952" y="206.5" font-size="21" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">الموقع الرسمي dmg</text><text x="952" y="238.0" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">→ Ollama</text><text x="952" y="281.0" font-size="21" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">npm</text><text x="952" y="312.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">→ Gemini CLI</text><text x="464" y="97.5" font-size="23" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">الآن: إدارة موحدة عبر</text><text x="464" y="132.0" font-size="23" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">Homebrew</text><text x="464" y="166.5" font-size="26" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">Homebrew</text><text x="464" y="205.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">brew upgrade</text><text x="464" y="238.5" font-size="26" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">↓</text><text x="464" y="277.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Claude Code</text><text x="464" y="310.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Ollama</text><text x="464" y="343.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Gemini CLI</text></g></svg>
