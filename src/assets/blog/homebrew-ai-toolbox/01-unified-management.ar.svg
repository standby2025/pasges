<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" lang="ar" role="img" aria-labelledby="title desc"><title id="title">ثلاث طرق للتثبيت والتحديث / مدخل واحد وأمر تحديث واحد</title><desc id="desc">مخطط مقارنة بعمودين. في العمود الأيمن يتصل نص curl بـ Claude Code وملف dmg من الموقع الرسمي بـ Ollama وnpm بـ Gemini CLI، مع ثلاث طرق مستقلة للترقية. في العمود الأيسر يدير Homebrew والأمر brew upgrade الأدوات الثلاث من نقطة واحدة. وضّح الفرق بين ثلاث طرق للترقية ومدخل موحد. تعليمات إعادة الإنشاء: أنشئ رسماً معلوماتياً مستقلاً بصيغة SVG أصلية، دون HTML أو نصوص برمجية أو اعتماد على موارد خارجية. خلفية بيضاء، ونص أزرق داكن #203047، وأشكال زرقاء #275fa4، وبنفسجي لمستودعات tap الخاصة بالمشاريع، ورمادي للمشاريع غير المدرجة. العرض 1000 بكسل، والارتفاع حسب المحتوى. لفّ التسميات بوضوح دون قصها، واستخدم اتجاه الكتابة من اليمين إلى اليسار. لغة النص: العربية.</desc><rect width="1000" height="505" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="968" y="42" font-size="29" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">ثلاث طرق للتثبيت والتحديث / مدخل واحد وأمر تحديث واحد</text><rect x="516" y="103.5" width="456" height="350" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><rect x="28" y="103.5" width="456" height="350" rx="12" fill="#f4f7fb" stroke="#d9e2ee"/><text x="744" y="147.6" font-size="23" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed" font-weight="600">سابقاً: طرق تثبيت منفصلة</text><text x="256" y="147.6" font-size="23" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed" font-weight="600">الآن: إدارة موحدة عبر Homebrew</text><rect x="802" y="198.5" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="877.0" y="221.8" font-size="19" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed">البرنامج</text><text x="877.0" y="244.6" font-size="19" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed">النصي curl</text><path d="M802 226.5 L756 226.5" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M754 226.5 l10 -6 l0 12 z" fill="#7d8fa6"/><rect x="536" y="198.5" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="643.0" y="233.8" font-size="21" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed" font-weight="600">Claude Code</text><rect x="802" y="268.5" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="877.0" y="291.8" font-size="19" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed">الموقع الرسمي</text><text x="877.0" y="314.6" font-size="19" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed">dmg</text><path d="M802 296.5 L756 296.5" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M754 296.5 l10 -6 l0 12 z" fill="#7d8fa6"/><rect x="536" y="268.5" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="643.0" y="303.9" font-size="21" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed" font-weight="600">Ollama</text><rect x="802" y="338.5" width="150" height="56" rx="10" fill="#eef2f8" stroke="#d9e2ee"/><text x="877.0" y="373.1" font-size="19" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed">npm</text><path d="M802 366.5 L756 366.5" stroke="#7d8fa6" stroke-width="2" fill="none"/><path d="M754 366.5 l10 -6 l0 12 z" fill="#7d8fa6"/><rect x="536" y="338.5" width="214" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="643.0" y="373.9" font-size="21" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed" font-weight="600">Gemini CLI</text><rect x="314" y="264.5" width="150" height="64" rx="10" fill="#275fa4" stroke="#275fa4"/><text x="389.0" y="291.8" font-size="19" fill="#ffffff" text-anchor="middle" direction="rtl" unicode-bidi="embed" font-weight="600">Homebrew</text><text x="389.0" y="314.6" font-size="19" fill="#ffffff" text-anchor="middle" direction="rtl" unicode-bidi="embed" font-weight="600">brew upgrade</text><path d="M314 296.5 C288.0 296.5 288.0 226.5 270 226.5" stroke="#275fa4" stroke-width="2.4" fill="none"/><path d="M262 226.5 l10 -6 l0 12 z" fill="#275fa4"/><rect x="36" y="198.5" width="222" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="147.0" y="233.8" font-size="21" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed" font-weight="600">Claude Code</text><path d="M314 296.5 C288.0 296.5 288.0 296.5 270 296.5" stroke="#275fa4" stroke-width="2.4" fill="none"/><path d="M262 296.5 l10 -6 l0 12 z" fill="#275fa4"/><rect x="36" y="268.5" width="222" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="147.0" y="303.9" font-size="21" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed" font-weight="600">Ollama</text><path d="M314 296.5 C288.0 296.5 288.0 366.5 270 366.5" stroke="#275fa4" stroke-width="2.4" fill="none"/><path d="M262 366.5 l10 -6 l0 12 z" fill="#275fa4"/><rect x="36" y="338.5" width="222" height="56" rx="10" fill="#ffffff" stroke="#7d8fa6"/><text x="147.0" y="373.9" font-size="21" fill="#203047" text-anchor="middle" direction="rtl" unicode-bidi="embed" font-weight="600">Gemini CLI</text><text x="744" y="439.4" font-size="17" fill="#5a6b80" text-anchor="middle" direction="rtl" unicode-bidi="embed">ثلاث طرق للتثبيت والتحديث</text><text x="256" y="439.4" font-size="17" fill="#5a6b80" text-anchor="middle" direction="rtl" unicode-bidi="embed">مدخل واحد وأمر تحديث واحد</text></g></svg>
