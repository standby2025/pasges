<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="641" viewBox="0 0 1000 641" lang="ar" role="img" aria-labelledby="title desc"><title id="title">عمليات التثبيت عبر Homebrew خلال آخر 30 يوماً</title><desc id="desc">مخطط أشرطة أفقي لعمليات التثبيت خلال آخر 30 يوماً: Codex 351138، uv 206718، Ollama 62453، Claude Code 58378، OpenCode 45393، llama.cpp 35373. تشمل قيمة Ollama أداة سطر الأوامر فقط، مع 8975 عملية إضافية للتطبيق. البيانات حتى 2026-11-09، وتشمل المستخدمين الذين فعّلوا التحليلات فقط. تعليمات إعادة الإنشاء: أنشئ رسماً معلوماتياً مستقلاً بصيغة SVG أصلية، دون HTML أو نصوص برمجية أو اعتماد على موارد خارجية. خلفية بيضاء، ونص أزرق داكن #203047، وأشكال زرقاء #275fa4، وبنفسجي لمستودعات tap الخاصة بالمشاريع، ورمادي للمشاريع غير المدرجة. العرض 1000 بكسل، والارتفاع حسب المحتوى. لفّ التسميات بوضوح دون قصها، واستخدم اتجاه الكتابة من اليمين إلى اليسار. لغة النص: العربية.</desc><rect width="1000" height="641" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="968" y="42" font-size="29" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">عمليات التثبيت عبر Homebrew خلال آخر 30 يوماً</text><text x="968" y="97.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Codex</text><rect x="32" y="118.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="118.5" width="702.3" height="24" rx="5" fill="#275fa4"/><text x="778" y="138.5" font-size="22" fill="#203047" direction="ltr">351,138</text><text x="968" y="175.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">uv</text><rect x="32" y="196.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="196.5" width="413.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="216.5" font-size="22" fill="#203047" direction="ltr">206,718</text><text x="968" y="253.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Ollama</text><rect x="32" y="274.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="274.5" width="124.9" height="24" rx="5" fill="#275fa4"/><text x="778" y="294.5" font-size="22" fill="#203047" direction="ltr">62,453</text><text x="968" y="331.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Claude Code</text><rect x="32" y="352.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="352.5" width="116.8" height="24" rx="5" fill="#275fa4"/><text x="778" y="372.5" font-size="22" fill="#203047" direction="ltr">58,378</text><text x="968" y="409.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">OpenCode</text><rect x="32" y="430.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="430.5" width="90.8" height="24" rx="5" fill="#275fa4"/><text x="778" y="450.5" font-size="22" fill="#203047" direction="ltr">45,393</text><text x="968" y="487.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">llama.cpp</text><rect x="32" y="508.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="508.5" width="70.7" height="24" rx="5" fill="#275fa4"/><text x="778" y="528.5" font-size="22" fill="#203047" direction="ltr">35,373</text><text x="968" y="565.5" font-size="18" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">اعتبارًا من 2026-11-09؛ يتم حساب المستخدمين الذين قاموا بتمكين التحليل فقط؛ يحتوي الإصدار</text><text x="968" y="592.5" font-size="18" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">Ollama App على أوقات 8,975.</text></g></svg>
