<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="512" viewBox="0 0 1000 512" lang="en" role="img" aria-labelledby="title desc"><title id="title">GitHub stars of AI-related packages</title><desc id="desc">horizontal bar chart, 297 AI related packages grouped by GitHub stars: less than 1000 stars 88, 1000 to 1 10,000 stars 126, 1 10,000 to 10 10,000 stars 72, 10 10,000 or more stars 11. Rough filtering by keywords may result in misjudgment. Rebuild prompt: Produce a standalone native SVG infographic without HTML, scripts or remote dependencies. White background, dark blue text #203047, blue graphics #275fa4, purple distinction item tap, gray distinction not included. Width 1000 pixels, the height adjusts according to the content; labels are clearly wrapped and not cropped; Arabic text is typeset from right to left. The text language is English.</desc><rect width="1000" height="512" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">GitHub stars of AI-related packages</text><text x="32" y="97.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">is less than 1000 stars</text><rect x="32" y="118.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="118.5" width="452.6" height="24" rx="5" fill="#275fa4"/><text x="778" y="138.5" font-size="22" fill="#203047" direction="ltr">88</text><text x="32" y="175.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">1000 to 1 Wan Xing</text><rect x="32" y="196.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="196.5" width="648.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="216.5" font-size="22" fill="#203047" direction="ltr">126</text><text x="32" y="253.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">1 Wanzhi 10 Wanxing</text><rect x="32" y="274.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="274.5" width="370.3" height="24" rx="5" fill="#275fa4"/><text x="778" y="294.5" font-size="22" fill="#203047" direction="ltr">72</text><text x="32" y="331.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">10 More than 10,000 stars</text><rect x="32" y="352.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="352.5" width="56.6" height="24" rx="5" fill="#275fa4"/><text x="778" y="372.5" font-size="22" fill="#203047" direction="ltr">11</text><text x="32" y="409.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">package quantity</text><text x="32" y="436.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">297 packages for which the star number can be found; rough filtering based on the AI</text><text x="32" y="463.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">keyword may result in misjudgment.</text></g></svg>
