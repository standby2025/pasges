<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="641" viewBox="0 0 1000 641" lang="en" role="img" aria-labelledby="title desc"><title id="title">Homebrew installations in the past 30 days</title><desc id="desc">Horizontal bar chart, number of installs in the past 30 days: Codex 351138, uv 206718, Ollama 62453, Claude Code 58378, OpenCode 45393, llama.cpp 35373. Ollama only contains the command line version, and App version also has 8975 times. The data ends at 2026-11-09. Only users who enable analysis are counted. Rebuild prompt: Produce a standalone native SVG infographic without HTML, scripts or remote dependencies. White background, dark blue text #203047, blue graphics #275fa4, purple distinction item tap, gray distinction not included. Width 1000 pixels, the height adjusts according to the content; labels are clearly wrapped and not cropped; Arabic text is typed from right to left. The text language is English.</desc><rect width="1000" height="641" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Homebrew installations in the past 30 days</text><text x="32" y="97.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Codex</text><rect x="32" y="118.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="118.5" width="702.3" height="24" rx="5" fill="#275fa4"/><text x="778" y="138.5" font-size="22" fill="#203047" direction="ltr">351,138</text><text x="32" y="175.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">uv</text><rect x="32" y="196.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="196.5" width="413.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="216.5" font-size="22" fill="#203047" direction="ltr">206,718</text><text x="32" y="253.5" font-size="2