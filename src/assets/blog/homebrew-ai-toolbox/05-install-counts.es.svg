<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="641" viewBox="0 0 1000 641" lang="es" role="img" aria-labelledby="title desc"><title id="title">Instalaciones de Homebrew en los últimos 30 días</title><desc id="desc">Gráfico de barras horizontales, número de instalaciones en los últimos días 30: Codex 351138, uv 206718, Ollama 62453, Claude Code 58378, OpenCode 45393, llama.cpp 35373. Ollama solo contiene la versión de línea de comando, y la versión App también contiene tiempos 8975. Los datos terminan en 2026-11-09. Sólo se cuentan los usuarios que habilitan el análisis. Reconstruir prompt: produzca una infografía nativa independiente de SVG sin HTML, scripts ni dependencias remotas. Fondo blanco, texto azul oscuro #203047, gráficos azules #275fa4, elemento de distinción violeta tap, distinción gris no incluida. Ancho 1000 píxeles, la altura se ajusta según el contenido; las etiquetas están claramente envueltas y no recortadas; El texto árabe se escribe de derecha a izquierda. El idioma del texto es español.</desc><rect width="1000" height="641" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Instalaciones de Homebrew en los últimos 30 días</text><text x="32" y="97.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Codex</text><rect x="32" y="118.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="118.5" width="702.3" height="24" rx="5" fill="#275fa4"/><text x="778" y="138.5" font-size="22" fill="#203047" direction="ltr">351,138</text><text x="32" y="175.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">uv</text><rect x="32" y="196.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="196.5" width="413.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="21