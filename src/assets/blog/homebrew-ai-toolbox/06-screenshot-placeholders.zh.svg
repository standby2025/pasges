<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" lang="zh" role="img" aria-labelledby="title desc"><title id="title">Homebrew.app 截图待补</title><desc id="desc">三张虚线边框占位卡片，分别标明 Homebrew.app 主界面、升级列表和对应命令提示截图待补。明确标为占位示意，不模仿或伪造真实界面。原稿版本 0.6.0，要求 macOS 26 及以上。 重建 prompt：制作独立原生 SVG 信息图，不含 HTML、脚本或远程依赖。白色背景，深蓝正文 #203047，蓝色图形 #275fa4，紫色区分项目 tap，灰色区分未收录。宽 1000 像素，高度随内容调整；标签清晰换行，不裁切；阿拉伯文使用从右向左文字排版。文字语言为 中文。</desc><rect width="1000" height="500" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Homebrew.app 截图待补</text><rect x="28" y="77.5" width="944" height="100" rx="12" fill="#f4f7fb" stroke="#91a3ba" stroke-dasharray="8 5"/><text x="48" y="112.5" font-size="24" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">主界面</text><rect x="28" y="195.5" width="944" height="100" rx="12" fill="#f4f7fb" stroke="#91a3ba" stroke-dasharray="8 5"/><text x="48" y="230.5" font-size="24" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">升级列表</text><rect x="28" y="313.5" width="944" height="100" rx="12" fill="#f4f7fb" stroke="#91a3ba" stroke-dasharray="8 5"/><text x="48" y="348.5" font-size="24" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">对应命令提示</text><text x="32" y="451.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">这是明确标注的占位图，不是真实产品截图；原稿记载 macOS 26+，版本 0.6.0。</text></g></svg>
