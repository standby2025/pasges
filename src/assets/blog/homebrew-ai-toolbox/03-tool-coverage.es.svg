<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1051" viewBox="0 0 1000 1051" lang="es" role="img" aria-labelledby="title desc"><title id="title">Software de IA popular: 17 de 23 en Homebrew</title><desc id="desc">. Agent 8/8: OpenClaw, DeepSeek Harness, Hermes Agent, ZXQ KEEP0006QXZ, Claude Code, Codex, Gemini CLI, Pi son todos almacenes oficiales. Modelos locales 3/3: Ollama, llama.cpp, Whisper, todos son almacenes oficiales. Otras herramientas 6/12: cc-switch, spec-kit, ComfyUI versión de escritorio, Open Design son almacenes oficiales; Orca, VoiceStudio son proyectos tap; claw-code, Stable Diffusion WebUI, Graphify, MoneyPrinterTurbo, Paperclip, RuView no están incluidos. Total 17/23, incluidos 15, tap y 2 oficiales. Reconstruir prompt: produzca una infografía nativa independiente de SVG sin HTML, scripts ni dependencias remotas. Fondo blanco, texto azul oscuro #203047, gráficos azules #275fa4, elemento de distinción violeta tap, distinción gris no incluida. Ancho 1000 píxeles, la altura se ajusta según el contenido; las etiquetas están claramente envueltas y no recortadas; El texto árabe se escribe de derecha a izquierda. El idioma del texto es español.</desc><rect width="1000" height="1051" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Software de IA popular: 17 de 23 en Homebrew</text><text x="32" y="97.5" font-size="19" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">■  · ■ Proyecto propio tap · □ Aún no incluido</text><text x="32" y="146.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">AI Agent y asistente de programación · 8 / 8</text><text x="32" y="179.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ OpenClaw · </text><text 