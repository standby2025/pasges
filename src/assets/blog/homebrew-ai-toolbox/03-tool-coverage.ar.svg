<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1024" viewBox="0 0 1000 1024" lang="ar" role="img" aria-labelledby="title desc"><title id="title">برامج الذكاء الاصطناعي الشائعة: 17 من 23 عبر Homebrew</title><desc id="desc">مصفوفة تغطية المشاريع. الوكلاء ومساعدو البرمجة 8/8: OpenClaw وDeepSeek Harness وHermes Agent وOpenCode وClaude Code وCodex وGemini CLI وPi، وجميعها في المستودع الرسمي. النماذج المحلية 3/3: Ollama وllama.cpp وWhisper، وجميعها رسمية. الأدوات الأخرى 6/12: cc-switch وspec-kit ونسخة ComfyUI لسطح المكتب وOpen Design رسمية؛ Orca وVoiceStudio في tap خاص بالمشروع؛ claw-code وStable Diffusion WebUI وGraphify وMoneyPrinterTurbo وPaperclip وRuView غير مدرجة. الإجمالي 17/23، منها 15 رسمية و2 في tap. تعليمات إعادة الإنشاء: أنشئ رسماً معلوماتياً مستقلاً بصيغة SVG أصلية، دون HTML أو نصوص برمجية أو اعتماد على موارد خارجية. خلفية بيضاء، ونص أزرق داكن #203047، وأشكال زرقاء #275fa4، وبنفسجي لمستودعات tap الخاصة بالمشاريع، ورمادي للمشاريع غير المدرجة. العرض 1000 بكسل، والارتفاع حسب المحتوى. لفّ التسميات بوضوح دون قصها، واستخدم اتجاه الكتابة من اليمين إلى اليسار. لغة النص: العربية.</desc><rect width="1000" height="1024" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="968" y="42" font-size="29" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">برامج الذكاء الاصطناعي الشائعة: 17 من 23 عبر Homebrew</text><text x="968" y="97.5" font-size="19" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">■ المستودع الرسمي · ■ المشروع الخاص tap · □ لم يتم تضمينها بعد</text><text x="968" y="146.0" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">AI Agent ومساعد البرمجة · 8 / 8</text><text x="968" y="179.0" font-size="20" fill="#275fa4" text-anchor="start" direction="rtl" unicode-bidi="embed">■ OpenClaw · المستودع الرسمي</text><text x="968" y="209.0" font-size="20" fill="#275fa4" te