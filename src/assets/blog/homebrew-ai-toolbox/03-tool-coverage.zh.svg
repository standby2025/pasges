<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1024" viewBox="0 0 1000 1024" lang="zh" role="img" aria-labelledby="title desc"><title id="title">热门 AI 软件：23 个中 17 个可用 Homebrew 安装</title><desc id="desc">项目覆盖矩阵。Agent 8/8：OpenClaw、DeepSeek Harness、Hermes Agent、OpenCode、Claude Code、Codex、Gemini CLI、Pi，均为官方仓库。本地模型 3/3：Ollama、llama.cpp、Whisper，均为官方仓库。其他工具 6/12：cc-switch、spec-kit、ComfyUI 桌面版、Open Design 为官方仓库；Orca、VoiceStudio 为项目 tap；claw-code、Stable Diffusion WebUI、Graphify、MoneyPrinterTurbo、Paperclip、RuView 未收录。总计 17/23，其中官方 15、tap 2。 重建 prompt：制作独立原生 SVG 信息图，不含 HTML、脚本或远程依赖。白色背景，深蓝正文 #203047，蓝色图形 #275fa4，紫色区分项目 tap，灰色区分未收录。宽 1000 像素，高度随内容调整；标签清晰换行，不裁切；阿拉伯文使用从右向左文字排版。文字语言为 中文。</desc><rect width="1000" height="1024" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">热门 AI 软件：23 个中 17 个可用 Homebrew 安装</text><text x="32" y="97.5" font-size="19" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">■ 官方仓库 · ■ 项目自有 tap · □ 暂未收录</text><text x="32" y="146.0" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">AI Agent 和编程助手 · 8 / 8</text><text x="32" y="179.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ OpenClaw · 官方仓库</text><text x="32" y="209.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ DeepSeek Harness · 官方仓库</text><text x="32" y="239.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ Hermes Agent · 官方仓库</text><text x="32" y="269.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ OpenCode · 官方仓库</text><text x="32" y="299.0" font-size="20" fill="#275fa4" text-anchor="start" direction="ltr" unicode-bidi="embed">■ Claude Code · 官方仓库</te