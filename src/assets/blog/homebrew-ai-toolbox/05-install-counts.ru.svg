<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="641" viewBox="0 0 1000 641" lang="ru" role="img" aria-labelledby="title desc"><title id="title">Установки через Homebrew за последние 30 дней</title><desc id="desc">Горизонтальная диаграмма, количество установок за последние 30 дни: Codex 351138, uv 206718, Ollama 62453, Claude Code 58378, OpenCode 45393, llama.cpp 35373. Ollama содержит только версию командной строки, а версия App также имеет время 8975. Данные заканчиваются на 2026-11-09. Учитываются только пользователи, включившие анализ. Перестроить prompt: создать автономную собственную инфографику SVG без HTML, сценариев или удаленных зависимостей. Белый фон, темно-синий текст #203047, синяя графика #275fa4, фиолетовый знак отличия tap, серый знак отличия не включен. Ширина 1000 пикселей, высота регулируется в зависимости от содержимого; этикетки четко завернуты и не обрезаны; Арабский текст набирается справа налево. Язык текста – русский.</desc><rect width="1000" height="641" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="29" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed" font-weight="600">Установки через Homebrew за последние 30 дней</text><text x="32" y="97.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Codex</text><rect x="32" y="118.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="118.5" width="702.3" height="24" rx="5" fill="#275fa4"/><text x="778" y="138.5" font-size="22" fill="#203047" direction="ltr">351,138</text><text x="32" y="175.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">uv</text><rect x="32" y="196.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="196.5" width="413.4" height="24" rx="5" fill="#275fa4"/><text x="778" y="216.5" font-size="22" fill="#203047" direction="ltr">206,718</text><text x="32" y="253.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Ollama</text><rect x="32" y="274.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="274.5" width="124.9" height="24" rx="5" fill="#275fa4"/><text x="778" y="294.5" font-size="22" fill="#203047" direction="ltr">62,453</text><text x="32" y="331.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">Claude Code</text><rect x="32" y="352.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="352.5" width="116.8" height="24" rx="5" fill="#275fa4"/><text x="778" y="372.5" font-size="22" fill="#203047" direction="ltr">58,378</text><text x="32" y="409.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">OpenCode</text><rect x="32" y="430.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="430.5" width="90.8" height="24" rx="5" fill="#275fa4"/><text x="778" y="450.5" font-size="22" fill="#203047" direction="ltr">45,393</text><text x="32" y="487.5" font-size="22" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">llama.cpp</text><rect x="32" y="508.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="508.5" width="70.7" height="24" rx="5" fill="#275fa4"/><text x="778" y="528.5" font-size="22" fill="#203047" direction="ltr">35,373</text><text x="32" y="565.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">до 2026-11-09; учитываются только пользователи, включившие анализ; Версия Ollama App имеет</text><text x="32" y="592.5" font-size="18" fill="#203047" text-anchor="start" direction="ltr" unicode-bidi="embed">время 8,975.</text></g></svg>
