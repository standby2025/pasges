<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="512" viewBox="0 0 1000 512" lang="ar" role="img" aria-labelledby="title desc"><title id="title">نجوم GitHub للحزم المرتبطة بالذكاء الاصطناعي</title><desc id="desc">مخطط أشرطة أفقي لتوزيع 297 حزمة مرتبطة بالذكاء الاصطناعي حسب نجوم GitHub: أقل من 1000 نجمة 88 حزمة؛ من 1000 إلى 10000 نجمة 126؛ من 10000 إلى 100000 نجمة 72؛ أكثر من 100000 نجمة 11. يعتمد الفرز على كلمات مفتاحية تقريبية وقد يتضمن أخطاء. تعليمات إعادة الإنشاء: أنشئ رسماً معلوماتياً مستقلاً بصيغة SVG أصلية، دون HTML أو نصوص برمجية أو اعتماد على موارد خارجية. خلفية بيضاء، ونص أزرق داكن #203047، وأشكال زرقاء #275fa4، وبنفسجي لمستودعات tap الخاصة بالمشاريع، ورمادي للمشاريع غير المدرجة. العرض 1000 بكسل، والارتفاع حسب المحتوى. لفّ التسميات بوضوح دون قصها، واستخدم اتجاه الكتابة من اليمين إلى اليسار. لغة النص: العربية.</desc><rect width="1000" height="512" rx="14" fill="#ffffff"/><g font-family="Arial, Noto Sans, Noto Sans Arabic, PingFang SC, Microsoft YaHei, sans-serif"><text x="968" y="42" font-size="29" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="600">نجوم GitHub للحزم المرتبطة بالذكاء الاصطناعي</text><text x="968" y="97.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">أقل من نجوم 1000</text><rect x="32" y="118.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="118.5" width="452.6" height="24" rx="5" fill="#275fa4"/><text x="778" y="138.5" font-size="22" fill="#203047" direction="ltr">88</text><text x="968" y="175.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">1000 إلى 1 مليون نجم</text><rect x="32" y="196.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="196.5" width="648.0" height="24" rx="5" fill="#275fa4"/><text x="778" y="216.5" font-size="22" fill="#203047" direction="ltr">126</text><text x="968" y="253.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">1 وان زي 10 وان شينغ</text><rect x="32" y="274.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="274.5" width="370.3" height="24" rx="5" fill="#275fa4"/><text x="778" y="294.5" font-size="22" fill="#203047" direction="ltr">72</text><text x="968" y="331.5" font-size="22" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">10 أكثر من 10000 نجمة</text><rect x="32" y="352.5" width="720" height="24" rx="5" fill="#e7edf5"/><rect x="32" y="352.5" width="56.6" height="24" rx="5" fill="#275fa4"/><text x="778" y="372.5" font-size="22" fill="#203047" direction="ltr">11</text><text x="968" y="409.5" font-size="18" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">كمية الحزمة</text><text x="968" y="436.5" font-size="18" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">حزم 297 التي يمكن العثور على رقم النجمة لها؛ قد تؤدي التصفية التقريبية المستندة إلى الكلمة</text><text x="968" y="463.5" font-size="18" fill="#203047" text-anchor="start" direction="rtl" unicode-bidi="embed">الأساسية AI إلى سوء التقدير.</text></g></svg>
